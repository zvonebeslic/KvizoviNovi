name: Audit Zemljopis exact tail
on:
  push:
    paths:
      - 'ZEMLJOPIS_TAIL_EXACT_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/audit_zemljopis_exact_tail.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Zemljopis.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Exact audit Zemljopis završni dio"
          git push
