name: Fix Gaming semantic final
on:
  push:
    paths:
      - 'scripts/fix_gaming_semantic_final.py'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply fixes
        run: python scripts/fix_gaming_semantic_final.py
      - name: Verify and commit
        run: |
          python - <<'PY'
          import json,collections
          d=json.load(open('Gaming.json',encoding='utf-8'))
          assert len(d)==444
          c=collections.Counter()
          for i,x in enumerate(d,1):
            assert set(x['answers'])==set('ABC'),i
            assert x['correct_answer'] in 'ABC',i
            assert len({x['answers'][k].casefold().strip() for k in 'ABC'})==3,i
            c[x['correct_answer']]+=1
          assert c=={'A':148,'B':148,'C':148},c
          print(c)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add Gaming.json
          git diff --cached --quiet || git commit -m 'Finalno uredi Gaming ABC odgovore'
          git push
