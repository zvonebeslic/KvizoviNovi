name: Audit Americki grammar
on:
  push:
    paths:
      - 'scripts/audit_americki_grammar.py'
      - '.github/workflows/audit_americki_grammar.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/audit_americki_grammar.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AMERICKI_GRAMMAR_AUDIT.json
          git commit -m "Izvezi grammar audit AmerickiPredsjednici" || exit 0
          git push