name: Audit Manual Anticki
on:
  push:
    paths:
      - 'scripts/audit_manual_anticki.py'
      - 'redo/AntickiRim*.json'
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/audit_manual_anticki.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add redo/AntickiRim_manual_audit.json
          git diff --cached --quiet || git commit -m "Update AntickiRim manual audit"
          git push
