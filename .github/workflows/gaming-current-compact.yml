name: Gaming current compact
on:
  push:
    paths:
      - '.github/workflows/gaming-current-compact.yml'
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export
        run: |
          python - <<'PY'
          import json
          d=json.load(open('Gaming.json',encoding='utf-8'))
          with open('gaming_current_compact.txt','w',encoding='utf-8') as f:
            for i,x in enumerate(d,1):
              a=x['answers']; ca=x['correct_answer']
              f.write(f"{i:03d}\t{ca}\t{x['question']}\tA={a['A']} | B={a['B']} | C={a['C']}\n")
          print('EXPORTED',len(d))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gaming-current-compact
          path: gaming_current_compact.txt
