name: Merge Anticki Main
on:
  push:
    paths:
      - 'scripts/merge_anticki_into_main.py'
      - '.github/workflows/merge-anticki-main.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/merge_anticki_into_main.py
      - name: Commit main JSON
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add AntickiRim.json
          git diff --cached --quiet || git commit -m "Merge final AntickiRim into main JSON"
          git push
