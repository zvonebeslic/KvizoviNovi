name: Fix Film 1-50
on:
  push:
    paths:
      - 'FILM_1_50_TRIGGER.txt'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_film_1_50.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Film.json
          if git diff --cached --quiet; then echo "No changes needed"; else git commit -m "Pregledaj Film pitanja 1-50" && git push; fi
