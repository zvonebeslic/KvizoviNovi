name: Fix Zemljopis 74-127

on:
  push:
    paths:
      - 'ZEMLJOPIS_74_127_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_zemljopis_74_127.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Zemljopis.json
          git diff --cached --quiet || git commit -m "Ispravi Zemljopis pitanja 74-127"
          git push
