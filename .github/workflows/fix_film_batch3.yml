name: Fix Film batch 3
on:
  push:
    paths:
      - 'scripts/fix_film_batch3.py'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_film_batch3.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Film.json
          git diff --cached --quiet || git commit -m "Uredi treci paket Film odgovora"
          git push
