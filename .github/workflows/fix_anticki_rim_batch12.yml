name: Fix AntickiRim batch 12
on:
  push:
    paths: ['.github/workflows/fix_anticki_rim_batch12.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite reviewed ABC answers
        shell: python
        run: |
          import json
          from pathlib import Path
          p=Path('AntickiRim.json'); data=json.loads(p.read_text(encoding='utf-8'))
          fixes={
          "Neron je prvi uveo porez na otkup urina iz javnih rimskih toaleta, a koji je car iza njega tu politiku nastavio koristeći uzrečicu 'pecunia non olet', što u prijevodu znači 'novac ne smrdi'?":{"A":"Vespazijan","B":"Tit","C":"Domicijan"},
          "U televizijskoj seriji iz 2006.g.,u produkciji HTV-a, se prikazuje koliko 'ludih rimskih careva'?":{"A":"3","B":"4","C":"5"},
          "Tko je bio posljednji iz plejade rimskih careva koji su vladali u 'godini 4 cara', točnije u 69-oj poslije Krista?":{"A":"Galba","B":"Vitelije","C":"Vespazijan"},
          "U godini 69. Vladala su 4 rimska cara, a koji od njih je za svog života vladao najkraće, točnije, samo 3 mjeseca?":{"A":"Oton","B":"Galba","C":"Vitelije"},
          "Pax Romana na latinskom prevodimo kao Rimski što?":{"A":"Zakon","B":"Mir","C":"Narod"},
          "I, V, X, L i C nazivamo kakvim brojevima?":{"A":"Arapskim","B":"Grčkim","C":"Rimskim"},
          "Središte kojeg španjolskog grada je u potpunosti okruženo s više od 2km rimskih zidina iz 3.st., a ime nosi po keltskom bogu svjetlosti te ga poistovjećujemo s malenim šumarkom ili ostacima nakon izgaranja?":{"A":"Lugo","B":"Leon","C":"Astorga"},
          "'Noli turbare circulos meos' je uzrečica koju uzvikuje koji slavni grčki matematičar prije pogibije od rimske ruke?":{"A":"Euklid","B":"Arhimed","C":"Pitagora"},
          "Ostaci kojeg su starorimskog grada slučajno otkriveni u 16.st ispod debelog sloja pepela?":{"A":"Herkulaneja","B":"Stabija","C":"Pompeja"},
          "Na koliko kontinenta se prostiralo rimsko carstvo?":{"A":"3","B":"2","C":"4"},
          "Opsada kojeg grada na bliskom istoku se događala 70-e, 1099-e i 1187-e godine?":{"A":"Damaska","B":"Jeruzalema","C":"Antiohije"},
          "Trajanov most iz 105.g., inače najduži most ikad napravljen u rimskom carstvu, bio je duži od 1 km, a da je ostao do danas spajao bi Rumunjsku sa kojom državom?":{"A":"Bugarskom","B":"Mađarskom","C":"Srbijom"},
          "Koji rimski zid spaja Firth of Forth sa Firth of Clyde?":{"A":"Antoninov zid","B":"Hadrijanov zid","C":"Aurelijanov zid"},
          "Najočuvanija te najveća starorimska gradska vrata na svijetu, imena Porta Nigra, se nalaze u kojem njemačkom gradu, gdje su i danas nezaobilazna turistička atrakcija?":{"A":"Mainzu","B":"Trieru","C":"Kölnu"},
          "Kako su nekada stari Rimljani nazivali područje današnje Škotske?":{"A":"Britanija","B":"Hibernija","C":"Kaledonija"},
          "Po kojem starorimskom državniku i filozofu, koji je detaljno opisao erupciju Vezuva, znanstvenici danas nazivaju najjači tip vulkanske erupcije?":{"A":"Pliniju","B":"Seneki","C":"Tacitu"},
          "Najduži most napravljen za vrijeme rimskog carstva (Trajanov most) bio je duži od jednog kilometra. Konstruirao ga je Apolodor iz Damaska. Služio je za napad na Dačko kraljevstvo, a premošćivao je koju rijeku?":{"A":"Savу","B":"Dunav","C":"Dravu"},
          "Koji su današnji srpski grad Rimljani poznavali kao Sirmium?":{"A":"Niš","B":"Beograd","C":"Srijemska Mitrovica"},
          "Forum kojeg rimskog cara je započet s izgradnjom 107.g., a završen 112.g., ujedno i najvećih od svih?":{"A":"Trajanov","B":"Augustov","C":"Nervin"},
          "Rimski senat caru Trajanu dodjeljuje koji naslov, koji mi možemo prevesti kao 'najbolji'?":{"A":"Augustus","B":"Optimus","C":"Invictus"},
          "Koji su naziv stari Rimljani koristili za Kinu, zemlju svile?":{"A":"Sinae","B":"Indica","C":"Seres"},
          "Koja je katolička svetica i čudotvorka umrla u 30-oj godini života kao redovnica u Egiptu, a rodila se u senatorskoj obitelji u Carigradu te bila rodbinski povezana sa carem Teodezijem?":{"A":"Eufrazija","B":"Melanija","C":"Pulherija"},
          "Koji antički rimski pisac i ugledni znanstvenik pogiba u erupciji vulkana Vezuva?":{"A":"Plinije Mlađi","B":"Plinije stariji","C":"Tacit"},
          "U godini 69. Rimom vladaju 4 cara, a koji od njih je te godine na vlasti bio najduže, točnije 8 mjeseci?":{"A":"Galba","B":"Oton","C":"Vitelije"},
          "U kojem stoljeću prije Krista nastaje Rimska Republika?":{"A":"6.","B":"5.","C":"7."},
          "Za vladavine kojeg rimskog cara se dogodila velika erupcija Vezuva u kojoj su Pompeji totalno uništeni?":{"A":"Vespazijana","B":"Tita","C":"Domicijana"},
          "Nakon ubojstva rimskog cara Domicijana nestaje flavijevska dinastija, a dolaze godine u kojima vlada koliko 'dobrih careva'?":{"A":"4","B":"6","C":"5"}
          }
          changed=0
          for x in data:
            if x.get('question') in fixes: x['answers']=fixes[x['question']]; changed+=1
          if changed!=len(fixes): raise SystemExit(f'Expected {len(fixes)}, got {changed}')
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Updated',changed)
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AntickiRim.json
          git diff --cached --quiet && exit 0
          git commit -m "Improve AntickiRim ABC distractors batch 12"
          git push
