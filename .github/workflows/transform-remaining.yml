name: Transform Remaining ABC

on:
  push:
    paths:
      - 'scripts/transform_remaining.py'
      - 'scripts/transform_remaining_v2.py'
      - '.github/workflows/transform-remaining.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Transform remaining JSON files
        run: python scripts/transform_remaining_v2.py
      - name: Validate all generated JSON files
        run: |
          for f in AmerickiPredsjednici.json AntickiRim.json Gaming.json Glazba.json Knjizevnost.json Moreplovci.json Nogomet.json Sport.json Svastara.json Zemljopis.json; do
            python -m json.tool "$f" > /dev/null
          done
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AmerickiPredsjednici.json AntickiRim.json Gaming.json Glazba.json Knjizevnost.json Moreplovci.json Nogomet.json Sport.json Svastara.json Zemljopis.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Pretvori sve preostale JSON baze u ABC format"
            git push
          fi
