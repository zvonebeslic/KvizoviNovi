name: Export Glazba 51-100
on:
  push:
    paths: ['GLAZBA_51_100_EXPORT_TRIGGER.txt']
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/export_glazba_51_100.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GLAZBA_51_100_REVIEW.json
          git commit -m "Izvezi Glazba pitanja 51-100" || exit 0
          git push
