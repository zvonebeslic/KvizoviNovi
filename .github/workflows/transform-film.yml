name: Transform Film ABC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/transform-film.yml'
      - 'scripts/transform_film.py'
      - 'scripts/film_distractors_*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Transform Film.json
        run: python scripts/transform_film.py
      - name: Validate JSON
        run: python -m json.tool Film.json > /dev/null
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Film.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Dovrsi Film.json ABC pretvorbu"
            git push
          fi
