name: Fix Zemljopis 191-220
on:
  push:
    paths:
      - 'ZEMLJOPIS_191_220_TRIGGER.txt'
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_zemljopis_191_220.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Zemljopis.json
          git diff --cached --quiet || git commit -m "Ručno popravi Zemljopis 191-220"
          git push
