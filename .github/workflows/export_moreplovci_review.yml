name: Export Moreplovci review
on:
  workflow_dispatch:
  push:
    paths: ['MOREPLOVCI_REVIEW_TRIGGER.txt']
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/export_moreplovci_review.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add review_moreplovci
          git diff --cached --quiet || (git commit -m 'Izvezi Moreplovci za rucni pregled' && git push)
