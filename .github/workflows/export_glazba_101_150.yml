name: Export Glazba 101-150
on:
  push:
    paths: ['GLAZBA_101_150_EXPORT_TRIGGER.txt']
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/export_glazba_101_150.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add GLAZBA_101_150_REVIEW.json
          git commit -m "Izvezi Glazba pitanja 101-150" || exit 0
          git push
