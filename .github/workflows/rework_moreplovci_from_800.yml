name: Rework Moreplovci from 800
on:
  workflow_dispatch:
  push:
    paths: ['MOREPLOVCI_800_TRIGGER.txt']
permissions:
  contents: write
jobs:
  rework:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python scripts/rework_moreplovci_from_800.py
      - name: Validate and commit
        run: |
          python - <<'PY'
          import json,collections
          d=json.load(open('Moreplovci.json',encoding='utf-8'))
          bad=[]
          for i,q in enumerate(d,1):
            a=q.get('answers',{}); c=q.get('correct_answer')
            if set(a)!=set('ABC') or c not in a or len({str(v).casefold() for v in a.values()})!=3: bad.append(i)
          print('TOTAL',len(d),'BAD',bad,'DIST',dict(collections.Counter(q['correct_answer'] for q in d)))
          assert not bad
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Moreplovci.json
          git diff --cached --quiet || (git commit -m 'Prepravi Moreplovce od retka 800' && git push)
