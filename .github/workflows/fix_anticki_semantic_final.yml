name: Fix remaining AntickiRim semantic distractors
on:
  push:
    paths: ['.github/workflows/fix_anticki_semantic_final.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          import json
          from pathlib import Path
          p=Path('AntickiRim.json'); d=json.loads(p.read_text(encoding='utf-8'))
          fixes={
          "Od kojeg plemenitog metala je bila rađena muralna kruna, kojom se nagrađivalo vojnika u starom rimu, koji se u boju prvi popeo i stao na neprijateljske zidine?":{"A":"Srebra","B":"Bronce","C":"Zlata"},
          "Neron je prvi uveo porez na otkup urina iz javnih rimskih toaleta, a koji je car iza njega tu politiku nastavio koristeći uzrečicu 'pecunia non olet', što u prijevodu znači 'novac ne smrdi'?":{"A":"Vespazijan","B":"Tit","C":"Domicijan"},
          "Tko je bio posljednji iz plejade rimskih careva koji su vladali u 'godini 4 cara', točnije u 69-oj poslije Krista?":{"A":"Galba","B":"Vitelije","C":"Vespazijan"},
          "U godini 69. Vladala su 4 rimska cara, a koji od njih je za svog života vladao najkraće, točnije, samo 3 mjeseca?":{"A":"Oton","B":"Galba","C":"Vitelije"},
          "Pax Romana na latinskom prevodimo kao Rimski što?":{"A":"Rat","B":"Mir","C":"Zakon"},
          "I, V, X, L i C nazivamo kakvim brojevima?":{"A":"Arapskim","B":"Grčkim","C":"Rimskim"},
          "Središte kojeg španjolskog grada je u potpunosti okruženo s više od 2km rimskih zidina iz 3.st., a ime nosi po keltskom bogu svjetlosti te ga poistovjećujemo s malenim šumarkom ili ostacima nakon izgaranja?":{"A":"Lugo","B":"León","C":"Astorga"},
          "'Noli turbare circulos meos' je uzrečica koju uzvikuje koji slavni grčki matematičar prije pogibije od rimske ruke?":{"A":"Euklid","B":"Arhimed","C":"Pitagora"},
          "Ostaci kojeg su starorimskog grada slučajno otkriveni u 16.st ispod debelog sloja pepela?":{"A":"Herkulanej","B":"Stabije","C":"Pompeja"},
          "Trajanov most iz 105.g., inače najduži most ikad napravljen u rimskom carstvu, bio je duži od 1 km, a da je ostao do danas spajao bi Rumunjsku sa kojom državom?":{"A":"Bugarskom","B":"Mađarskom","C":"Srbijom"},
          "Koji rimski zid spaja Firth of Forth sa Firth of Clyde?":{"A":"Antoninov zid","B":"Hadrijanov zid","C":"Aurelijanov zid"},
          "Kako su nekada stari Rimljani nazivali područje današnje Škotske?":{"A":"Britanija","B":"Hibernija","C":"Kaledonija"},
          "Po kojem starorimskom državniku i filozofu, koji je detaljno opisao erupciju Vezuva, znanstvenici danas nazivaju najjači tip vulkanske erupcije?":{"A":"Plinije","B":"Seneka","C":"Tacit"},
          "Najduži most napravljen za vrijeme rimskog carstva (Trajanov most) bio je duži od jednog kilometra. Konstruirao ga je Apolodor iz Damaska. Služio je za napad na Dačko kraljevstvo, a premošćivao je koju rijeku?":{"A":"Rajnu","B":"Dunav","C":"Savu"},
          "Forum kojeg rimskog cara je započet s izgradnjom 107.g., a završen 112.g., ujedno i najvećih od svih?":{"A":"Trajanov","B":"Augustov","C":"Nervin"},
          "Rimski senat caru Trajanu dodjeljuje koji naslov, koji mi možemo prevesti kao 'najbolji'?":{"A":"Maximus","B":"Optimus","C":"Invictus"},
          "Koji su naziv stari Rimljani koristili za Kinu, zemlju svile?":{"A":"Sinae","B":"Indi","C":"Seres"},
          "Koja je katolička svetica i čudotvorka umrla u 30-oj godini života kao redovnica u Egiptu, a rodila se u senatorskoj obitelji u Carigradu te bila rodbinski povezana sa carem Teodezijem?":{"A":"Eufrazija","B":"Melanija","C":"Makrina"},
          "Koji antički rimski pisac i ugledni znanstvenik pogiba u erupciji vulkana Vezuva?":{"A":"Svetonije","B":"Plinije stariji","C":"Tacit"},
          "U godini 69. Rimom vladaju 4 cara, a koji od njih je te godine na vlasti bio najduže, točnije 8 mjeseci?":{"A":"Galba","B":"Oton","C":"Vitelije"},
          "Za vladavine kojeg rimskog cara se dogodila velika erupcija Vezuva u kojoj su Pompeji totalno uništeni?":{"A":"Vespazijana","B":"Tita","C":"Domicijana"},
          "Koju su latinsku riječ stari Rimljani koristili za 'grad'?":{"A":"Civitas","B":"Urbs","C":"Oppidum"},
          "U kojoj se današnjoj državi nalazi zid rimskog cara Antonina Pia, dugačak 63 km?":{"A":"Engleskoj","B":"Walesu","C":"Škotskoj"},
          "Koji su portugalski grad stari Rimljani poznavali kao Olissipo?":{"A":"Lisabon","B":"Porto","C":"Braga"},
          "Koji broj stari Rimljani nisu poznavali?":{"A":"Negativne brojeve","B":"Nula","C":"Razlomke"},
          "Porazom kojeg makedonskog kralja, Makedonija postaje rimskom provincijom?":{"A":"Perzeja","B":"Filipa V.","C":"Andriska"},
          "Protiv kojeg vojskovođe su rimljani u punskim ratovima koristili 'fabijanovu taktiku', to jest, izbjegavanje direktnog sukoba s neprijateljskom vojskom?":{"A":"Hasdrubala","B":"Hanibala","C":"Magona"},
          "Koje je utvrđeno galsko naselje Cezar uspio osvojiti 52.g. pr. Kr.?":{"A":"Gergoviju","B":"Avarik","C":"Aleziju"},
          "Rimski konzul Marko Porcije Katon Stariji je većinu svojih govora u senatu završavao rečenicom da spaliti treba koga?":{"A":"Korint","B":"Sirakuzu","C":"Kartagu"},
          "Prema legendi, na kojem od 7 brežuljaka je Romul osnovao prvo naselje?":{"A":"Palatinu","B":"Aventinu","C":"Kapitolu"},
          "U starorimskoj republici, koju titulu obnašaju dvojica najviših službenika koji zajedno sa senatom upravljaju državom?":{"A":"Pretor","B":"Cenzor","C":"Konzul"},
          "Koji ilirski kralj je sudjelovao u 3. Rimsko - Ilirskom ratu?":{"A":"Pleurat III.","B":"Gencije","C":"Agron"},
          "Koji vizigotski vođa nanosi veliki poraz rimskom carstvu kod Hadrijanopola gdje i sam car Valens pogiba u bitci?":{"A":"Alarik","B":"Atanariks","C":"Fritiger"}
          }
          n=0
          for x in d:
            q=x.get('question')
            if q in fixes:
              # preserve correct_answer and question; only replace answers
              x['answers']=fixes[q]
              n+=1
          print('matched',n,'of',len(fixes))
          if n!=len(fixes):
            missing=[q for q in fixes if not any(x.get('question')==q for x in d)]
            raise SystemExit('Missing: '+repr(missing))
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AntickiRim.json
          git diff --cached --quiet && exit 0
          git commit -m "Fix remaining nonsensical AntickiRim distractors"
          git push
