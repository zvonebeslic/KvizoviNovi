name: Final Gaming cleanup
on:
  push:
    paths:
      - 'scripts/final_gaming_cleanup.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Final Gaming semantic cleanup
        run: python scripts/final_gaming_cleanup.py
      - name: Commit Gaming
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Gaming.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Final Gaming ABC cleanup'
          git push
