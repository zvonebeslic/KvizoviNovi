name: Rebalance AntickiRim correct answer positions
on:
  push:
    paths: ['.github/workflows/rebalance_anticki_answers.yml']
permissions:
  contents: write
jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          import json, random
          from collections import Counter
          from pathlib import Path

          p=Path('AntickiRim.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          n=len(d)
          if n != 589:
              raise SystemExit(f'Expected 589 questions, got {n}')

          # Exact target totals, but arranged in a mixed sequence with no long runs.
          labels=['A']*197 + ['B']*196 + ['C']*196
          rng=random.Random(20260910)

          def good(seq):
              # Never allow 3 identical correct letters in a row.
              for i in range(2, len(seq)):
                  if seq[i]==seq[i-1]==seq[i-2]:
                      return False
              # Keep each rolling block of 30 reasonably balanced.
              for i in range(0, len(seq)-29):
                  c=Counter(seq[i:i+30])
                  if max(c.values()) > 13 or min(c.values()) < 7:
                      return False
              return True

          for _ in range(200000):
              rng.shuffle(labels)
              if good(labels):
                  break
          else:
              raise SystemExit('Could not generate suitably mixed target sequence')

          # Move the existing correct answer text to the target letter by swapping slots.
          # Question text and answer texts themselves stay unchanged.
          before_questions=[x['question'] for x in d]
          before_answer_sets=[sorted(x['answers'].values()) for x in d]

          for x,target in zip(d,labels):
              old=x['correct_answer']
              if old != target:
                  ans=dict(x['answers'])
                  ans[old], ans[target] = ans[target], ans[old]
                  x['answers']=ans
                  x['correct_answer']=target

          after=Counter(x['correct_answer'] for x in d)
          assert after == Counter({'A':197,'B':196,'C':196}), after
          assert before_questions == [x['question'] for x in d]
          assert before_answer_sets == [sorted(x['answers'].values()) for x in d]

          max_run=1
          run=1
          seq=[x['correct_answer'] for x in d]
          for i in range(1,len(seq)):
              run = run+1 if seq[i]==seq[i-1] else 1
              max_run=max(max_run,run)

          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('ANTICKI_REBALANCE_CHECK.txt').write_text(
              f"TOTAL={n}\nA={after['A']}\nB={after['B']}\nC={after['C']}\nMAX_RUN={max_run}\nFIRST_60={''.join(seq[:60])}\n",
              encoding='utf-8')
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AntickiRim.json ANTICKI_REBALANCE_CHECK.txt
          git commit -m "Rebalance AntickiRim answer positions"
          git push
