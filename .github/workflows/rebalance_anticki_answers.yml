name: Rebalance AntickiRim correct answer positions
on:
  push:
    paths: ['.github/workflows/rebalance_anticki_answers.yml']
permissions:
  contents: write
jobs:
  rebalance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          import json, random
          from collections import Counter
          from pathlib import Path

          p=Path('AntickiRim.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          if len(d) != 589:
              raise SystemExit(f'Expected 589 questions, got {len(d)}')

          rng=random.Random(20260910)
          labels=[]
          for _ in range(196):
              block=['A','B','C']
              rng.shuffle(block)
              labels.extend(block)
          # 588 questions gives 196 of each; add one extra A in a safe place.
          insert_at=137
          labels.insert(insert_at,'A')

          before_questions=[x['question'] for x in d]
          before_answer_sets=[sorted(x['answers'].values()) for x in d]
          before_correct_texts=[x['answers'][x['correct_answer']] for x in d]

          for x,target in zip(d,labels):
              old=x['correct_answer']
              if old != target:
                  ans=dict(x['answers'])
                  ans[old], ans[target] = ans[target], ans[old]
                  x['answers']=ans
                  x['correct_answer']=target

          after=Counter(x['correct_answer'] for x in d)
          assert after == Counter({'A':197,'B':196,'C':196}), after
          assert before_questions == [x['question'] for x in d]
          assert before_answer_sets == [sorted(x['answers'].values()) for x in d]
          assert before_correct_texts == [x['answers'][x['correct_answer']] for x in d]

          seq=[x['correct_answer'] for x in d]
          max_run=1
          run=1
          for i in range(1,len(seq)):
              run = run+1 if seq[i]==seq[i-1] else 1
              max_run=max(max_run,run)
          if max_run > 2:
              raise SystemExit(f'Max run too high: {max_run}')

          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('ANTICKI_REBALANCE_CHECK.txt').write_text(
              f"TOTAL=589\nA={after['A']}\nB={after['B']}\nC={after['C']}\nMAX_RUN={max_run}\nFIRST_90={''.join(seq[:90])}\n",
              encoding='utf-8')
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AntickiRim.json ANTICKI_REBALANCE_CHECK.txt
          git diff --cached --quiet && exit 0
          git commit -m "Rebalance AntickiRim answer positions"
          git push
