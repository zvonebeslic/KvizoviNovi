name: Export Film 151-end
on:
  push:
    paths: ['FILM_151_END_TRIGGER.txt']
jobs:
  export:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/export_film_151_end.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FILM_151_END_REVIEW.json
          git commit -m "Izvezi završni Film pregled" || exit 0
          git push
