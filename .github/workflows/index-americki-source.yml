name: Index Americki Source

on:
  push:
    paths:
      - 'scripts/index_americki_source.py'
      - '.github/workflows/index-americki-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/index_americki_source.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add redo/AmerickiPredsjednici_source_index.json
          git commit -m "Generiraj točan indeks AmerickiPredsjednici izvora" || exit 0
          git push
