name: Audit AntickiRim
on:
  push:
    paths: ['.github/workflows/audit_anticki_rim.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          import json
          from pathlib import Path
          d=json.loads(Path('AntickiRim.json').read_text(encoding='utf-8'))
          issues=[]; counts={'A':0,'B':0,'C':0}; bad=set()
          for i,x in enumerate(d):
            ca=x.get('correct_answer'); ans=x.get('answers',{})
            if ca in counts: counts[ca]+=1
            if set(ans)!={'A','B','C'} or ca not in ans or len({str(v).strip().casefold() for v in ans.values()})<3:
              bad.add(i+1)
            for k,v in ans.items():
              if k==ca: continue
              for j in range(max(0,i-3),min(len(d),i+4)):
                if j==i: continue
                y=d[j]; yca=y.get('correct_answer'); yans=y.get('answers',{})
                if yca in yans and str(v).strip().casefold()==str(yans[yca]).strip().casefold():
                  bad.add(i+1); issues.append({'i':i+1,'q':x.get('question'),'wrong':v,'answers':ans,'correct':ca}); break
          inds=sorted(bad)
          ranges=[]
          if inds:
            s=p=inds[0]
            for n in inds[1:]:
              if n<=p+2: p=n
              else: ranges.append([s,p]); s=p=n
            ranges.append([s,p])
          Path('AntickiRim_audit.json').write_text(json.dumps({'total':len(d),'correct_counts':counts,'bad_indices':inds,'ranges':ranges,'issues':issues},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          Path('AntickiRim_audit_summary.txt').write_text(f'TOTAL={len(d)}\nCOUNTS={counts}\nBAD_COUNT={len(inds)}\nRANGES={ranges}\n',encoding='utf-8')
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AntickiRim_audit.json AntickiRim_audit_summary.txt
          git diff --cached --quiet && exit 0
          git commit -m "Summarize AntickiRim audit ranges"
          git push
