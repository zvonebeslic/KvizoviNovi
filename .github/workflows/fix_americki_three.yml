name: Fix three ambiguous AmerickiPredsjednici answers

on:
  push:
    paths:
      - '.github/workflows/fix_americki_three.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix three ambiguous questions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('AmerickiPredsjednici.json')
          data = json.loads(p.read_text(encoding='utf-8'))

          fixes = {
            'Za vrijeme predsjednika Thomasa Jeffersona, amerikanci od francuza kupuju veliku površinu Sjeverne Amerike tada poznatu pod kojim imenom?': {
              'answers': {'A': 'Florida', 'B': 'Oregon', 'C': 'Louisiana'},
              'correct_answer': 'C'
            },
            'Koje je luksuzno odmaralište na Floridi u vlasništvu Donalda Trumpa?': {
              'answers': {'A': 'Trump National Golf Club Bedminster', 'B': 'Seven Springs', 'C': 'Mar a Lago'},
              'correct_answer': 'C'
            },
            'Washington je 1776. i 1777.g. u ratu za neovisnost pobjedio britance kod Trentona i Prestona, ali i izgubio kod kojeg mjesta?': {
              'answers': {'A': 'Long Island', 'B': 'Yorktown', 'C': 'Princeton'},
              'correct_answer': 'A'
            }
          }

          found = set()
          for item in data:
            q = item.get('question')
            if q in fixes:
              item['answers'] = fixes[q]['answers']
              item['correct_answer'] = fixes[q]['correct_answer']
              found.add(q)

          missing = set(fixes) - found
          if missing:
            raise SystemExit(f'Missing target questions: {missing}')

          p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Fixed', len(found), 'questions')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AmerickiPredsjednici.json
          git diff --cached --quiet && exit 0
          git commit -m 'Fix three ambiguous presidential quiz questions'
          git push
