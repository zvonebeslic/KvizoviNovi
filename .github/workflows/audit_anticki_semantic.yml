name: Audit AntickiRim semantic candidates
on:
  push:
    paths: ['.github/workflows/audit_anticki_semantic.yml']
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          import json,re
          from pathlib import Path
          d=json.loads(Path('AntickiRim.json').read_text(encoding='utf-8'))
          # Mechanical candidate finder: answers reused unusually close to neighboring questions,
          # mixed obvious data types, and answers containing suspicious emoji/artifacts.
          rows=[]
          for i,x in enumerate(d):
            q=x['question']; a=x['answers']; vals=list(a.values())
            reasons=[]
            types=[]
            for v in vals:
              s=str(v).strip()
              if re.fullmatch(r'[+-]?\d+(?:[.,]\d+)?(?:\s*(?:godina|godine|godinu|stoljeća|mjeseci|km|m|%))?',s,re.I): t='num'
              elif re.search(r'🥇|�|\bundefined\b|\bnull\b',s,re.I): t='artifact'
              else: t='text'
              types.append(t)
            if 'artifact' in types: reasons.append('artifact')
            if 'num' in types and 'text' in types: reasons.append('mixed-num-text')
            # answer copied from a nearby question's correct answer is a useful signal for prior spillover
            near=[]
            for j in range(max(0,i-2),min(len(d),i+3)):
              if j==i: continue
              ca=d[j].get('correct_answer'); av=d[j].get('answers',{}).get(ca)
              if av in vals: near.append((j+1,av))
            if near: reasons.append('nearby-correct-reuse:'+','.join(f'{j}:{v}' for j,v in near))
            if reasons:
              rows.append(f"#{i+1} | {'; '.join(reasons)}\nQ: {q}\nA: {a.get('A')} | B: {a.get('B')} | C: {a.get('C')} | correct={x.get('correct_answer')}\n")
          Path('ANTICKI_RIM_SEMANTIC_CANDIDATES.txt').write_text('\n'.join(rows),encoding='utf-8')
          print('candidates',len(rows))
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ANTICKI_RIM_SEMANTIC_CANDIDATES.txt
          git commit -m "Audit AntickiRim semantic answer candidates" || exit 0
          git push
