name: Fix Glazba 1-50
on:
  push:
    paths: ['GLAZBA_1_50_TRIGGER.txt']
  workflow_dispatch:
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_glazba_1_50.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Glazba.json
          git commit -m "Uredi Glazba pitanja 1-50" || exit 0
          git push
