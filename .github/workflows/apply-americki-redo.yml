name: Apply Americki redo

on:
  push:
    paths:
      - 'scripts/apply_americki_redo.py'
      - '.github/workflows/apply-americki-redo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/apply_americki_redo.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AmerickiPredsjednici.json
          git commit -m "Uredi odgovore za Americke predsjednike" || exit 0
          git push
