name: Fix remaining AntickiRim semantic distractors
on:
  push:
    paths: ['.github/workflows/fix_anticki_rim_final_semantic.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          import json
          from pathlib import Path
          p=Path('AntickiRim.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          distractors={
          68:['Meditacije','Razgovori sa samim sobom'],
          69:['Partskim','Sasanidskim'],
          72:['Srebra','Bronce'],
          234:['Monarhiju','Oligarhiju'],
          258:['Omfala','Dejanira'],
          313:['Tit','Domicijan'],
          315:['Galba','Vitelije'],
          316:['Galba','Vitelije'],
          317:['Rat','Poredak'],
          318:['Arapskim','Grčkim'],
          319:['León','Astorga'],
          320:['Euklid','Pitagora'],
          321:['Herkulanej','Stabije'],
          323:['Damask','Antiohija'],
          324:['Bugarskom','Mađarskom'],
          325:['Hadrijanov zid','Aurelijanov zid'],
          326:['Mainz','Köln'],
          327:['Britanija','Hibernija'],
          328:['Seneka','Tacit'],
          329:['Rajna','Tibar'],
          330:['Beograd','Niš'],
          331:['Augustov','Nervin'],
          332:['Augustus','Germanicus'],
          333:['Sinae','Thinae'],
          334:['Melanija Mlađa','Makrina Mlađa'],
          335:['Svetonije','Tacit'],
          336:['Galba','Oton'],
          338:['Vespazijana','Domicijana'],
          386:['Civitas','Oppidum'],
          387:['Engleskoj','Walesu'],
          388:['Braga','Coimbra'],
          419:['Deset','Tisuću'],
          421:['Filipa V.','Andriska'],
          422:['Scipiona','Hasdrubala'],
          424:['Pompeja Velikog','Marka Antonija'],
          425:['Gergoviju','Aleziju'],
          426:['Korint','Numanciju'],
          427:['Aventinu','Kapitolu'],
          428:['Galbu','Vitelija'],
          429:['Pretor','Cenzor'],
          430:['Anko Marcije','Servije Tulije'],
          431:['Agron','Pleurat III.'],
          432:['Alarik','Atanariks'],
          433:['Ataulf','Teodorik I.'],
          572:['Berenika','Amanirenas'],
          575:['Klaudije','Neron'],
          579:['Mars','Merkur']
          }
          changed=0
          for idx, wrongs in distractors.items():
            x=d[idx-1]
            correct=x['correct_answer']
            old_correct=x['answers'][correct]
            keys=[k for k in ('A','B','C') if k!=correct]
            new=dict(x['answers'])
            new[keys[0]]=wrongs[0]
            new[keys[1]]=wrongs[1]
            if new[correct] != old_correct:
              raise SystemExit(f'Correct answer changed at #{idx}')
            x['answers']=new
            changed+=1
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Updated',changed,'sets; correct answers and questions untouched')
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AntickiRim.json
          git diff --cached --quiet && exit 0
          git commit -m "Fix remaining AntickiRim semantic distractors"
          git push
