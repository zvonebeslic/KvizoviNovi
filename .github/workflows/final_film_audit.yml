name: Final Film audit
on:
  push:
    paths:
      - 'FINAL_FILM_AUDIT_TRIGGER.txt'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/final_film_audit.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Film.json
          git commit -m "Završno dotjeraj Film pitanja" || exit 0
          git push
