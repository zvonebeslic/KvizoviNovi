name: Fix AntickiRim reviewed next 50 06
on:
  push:
    paths: ['.github/workflows/fix_anticki_rim_review_next50_06.yml']
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          import json
          from pathlib import Path
          p=Path('AntickiRim.json'); d=json.loads(p.read_text(encoding='utf-8'))
          f={
          "U blizini kojeg drevnog grada u turskoj je Partsko carstvo 53.g. pr. Kr. nanijelo Rimljanima jedan od najvećih vojnih poraza u njihovoj povijesti?":{"A":"Haran","B":"Edessa","C":"Nisibis"},
          "Koji današnji španjolski grad Rimljani razaraju te ponovno uspostavljaju pod imenom Hispalis, a pored njega i grad Italicu, danas jedan od najvećih rimskih arheoloških lokaliteta u toj zemlji?":{"A":"Cordobu","B":"Sevillu","C":"Cadiz"},
          "Koji je evanđelist bio prognan od strane rimskog cara Domicijana na zatvorski otok Patmos, gdje je u špilji napisao Knjigu Otkrivenja?":{"A":"Matej","B":"Marko","C":"Ivan"},
          "Titule 'Princeps, Imperator, Caesar i Augustus' su se pripisivale kojim rimskim dužnosnicima?":{"A":"Carevima","B":"Konzulima","C":"Cenzorima"}
          }
          n=0
          for x in d:
            q=x.get('question')
            if q in f:
              x['answers']=f[q]; n+=1
          if n!=len(f): raise SystemExit(f'Matched {n}/{len(f)}')
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Updated',n)
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AntickiRim.json
          git diff --cached --quiet && exit 0
          git commit -m "Fix next reviewed AntickiRim ABC answers 06"
          git push
