name: Audit Zemljopis exact tail 2
on:
  push:
    paths:
      - 'ZEMLJOPIS_EXACT_TAIL_2_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/audit_zemljopis_exact_tail_2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Zemljopis.json
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Exact audit Zemljopis završni dio 2" && git push; fi
