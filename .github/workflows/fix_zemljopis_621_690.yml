name: Fix Zemljopis 621-690
on:
  push:
    paths:
      - 'ZEMLJOPIS_621_690_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix questions 621-690
        run: python scripts/fix_zemljopis_621_690.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Zemljopis.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Ručno popravi Zemljopis 621-690"
            git push
          fi
