name: Fix Zemljopis 521-550
on:
  push:
    paths:
      - 'ZEMLJOPIS_521_550_TRIGGER.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/fix_zemljopis_521_550.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Zemljopis.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rucno popravi Zemljopis 521-550"
          git push