name: Export Film 51-100
on:
  push:
    paths:
      - 'FILM_51_100_TRIGGER.txt'
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/export_film_51_100.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FILM_51_100_REVIEW.json
          git commit -m "Izvezi Film 51-100 za pregled" || exit 0
          git push
